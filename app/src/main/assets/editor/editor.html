<!DOCTYPE html>
<!--
  In-app code viewer for the file manager, modelled after the Acode editor
  (https://github.com/Acode-Foundation/Acode): CodeMirror 5 rendered inside a WebView.
  Java drives it through window.editorApi and the AndroidBridge object that the
  CodeViewerDialog injects with addJavascriptInterface().
-->
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Code</title>
    <link rel="stylesheet" href="codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="codemirror/addon/dialog/dialog.css">
    <link rel="stylesheet" href="codemirror/theme/material-darker.css">
    <link rel="stylesheet" href="codemirror/theme/eclipse.css">
    <script src="codemirror/lib/codemirror.js"></script>
    <script src="codemirror/mode/meta.js"></script>
    <script src="codemirror/mode/javascript.js"></script>
    <script src="codemirror/mode/xml.js"></script>
    <script src="codemirror/mode/css.js"></script>
    <script src="codemirror/mode/htmlmixed.js"></script>
    <script src="codemirror/mode/clike.js"></script>
    <script src="codemirror/mode/python.js"></script>
    <script src="codemirror/mode/ruby.js"></script>
    <script src="codemirror/mode/php.js"></script>
    <script src="codemirror/mode/shell.js"></script>
    <script src="codemirror/mode/yaml.js"></script>
    <script src="codemirror/mode/markdown.js"></script>
    <script src="codemirror/mode/gfm.js"></script>
    <script src="codemirror/mode/sql.js"></script>
    <script src="codemirror/mode/diff.js"></script>
    <script src="codemirror/mode/dockerfile.js"></script>
    <script src="codemirror/mode/groovy.js"></script>
    <script src="codemirror/mode/cmake.js"></script>
    <script src="codemirror/mode/nginx.js"></script>
    <script src="codemirror/mode/properties.js"></script>
    <script src="codemirror/mode/stex.js"></script>
    <script src="codemirror/mode/toml.js"></script>
    <script src="codemirror/addon/dialog/dialog.js"></script>
    <script src="codemirror/addon/search/searchcursor.js"></script>
    <script src="codemirror/addon/search/search.js"></script>
    <script src="codemirror/addon/search/jump-to-line.js"></script>
    <script src="codemirror/addon/edit/closebrackets.js"></script>
    <script src="codemirror/addon/edit/matchbrackets.js"></script>
    <script src="codemirror/addon/edit/closetag.js"></script>
    <script src="codemirror/addon/selection/active-line.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #212121;
        }

        .CodeMirror {
            height: 100%;
            font-family: "Roboto Mono", "Droid Sans Mono", "Source Code Pro", Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .CodeMirror-scroll {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <script src="editor.js"></script>
</body>
</html>
